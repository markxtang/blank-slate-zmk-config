# Comment out to disable soft-off, or if using a different branch without soft-off support
CONFIG_ZMK_PM_SOFT_OFF=y

# Default (64) is too small for macros that tap out long strings (e.g. mcr_linkedin
# needs 38 chars x 2 events = 76 queued items). A full queue silently drops events,
# which can leave a key's release lost and stuck "held" (endless auto-repeat).
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128
